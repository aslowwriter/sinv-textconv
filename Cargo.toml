[package]
name         = "sinv-textconv"
version      = "0.1.1"
authors      = ["ASlowWriter <savente93@proton.me>"]
edition      = "2024"
rust-version = "1.85"
description  = "A git textconv utility for Sphinx object inventory files"
readme       = "README.md"
license      = "MIT"


documentation = "https://docs.rs/sinv-textconv"
repository    = "https://github.com/aslowwriter/sinv-textconv"


[[bin]]
path = "src/main.rs"
name = "sinv-textconv"


[dependencies]
thiserror           = "2.0"
flate2    = "1.1.9"
clap = { version = "4.6.4", features = ["derive"] }


[dev-dependencies]
assert_cmd        = "2.2.2"
pretty_assertions = "1"


[profile.release]
debug         = 0
lto           = "fat"
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = 0

[profile.bench]
inherits = "release"
debug    = 2         # necessary for many profilers
strip    = "none"    #only affects binary size, not runtime, but makes profiling easier

# please tell me what to do Clippy-senpai
[lints.clippy]
pedantic                   = { level = "warn", priority = -1 }
single_match               = "warn"
single_match_else          = "warn"
needless_match             = "warn"
needless_late_init         = "warn"
redundant_pattern_matching = "warn"
redundant_pattern          = "warn"
redundant_guards           = "warn"
collapsible_match          = "warn"
match_single_binding       = "warn"
match_same_arms            = "warn"
match_ref_pats             = "warn"
match_bool                 = "warn"
needless_bool              = "deny"
unwrap_used                = "warn"
expect_used                = "warn"
must_use_candidate         = "allow"
missing_errors_doc         = "allow"
missing_panics_doc         = "allow"
